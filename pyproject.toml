[project]
name = "prc-2026"
version = "0.1.0"
description = "Recorded taxi-out time model for the EUROCONTROL PRC Data Challenge 2026 (team gentle-igloo)"
readme = "README.md"
license = "GPL-3.0-only"
authors = [{ name = "Denys Kolomiiets" }]
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "lightgbm>=4.7.0",
    "minio>=7.2.20",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
    "tabpfn>=8.5.0",
    "xgboost>=3.4.1",
]
